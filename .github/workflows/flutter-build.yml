name: Build Flutter Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # يسمح بالتشغيل اليدوي
    inputs:
      version:
        description: 'Version number'
        required: true
        default: '25.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'  # إصدار مستقر حديث
        channel: 'stable'
        cache: true
        cache-key: 'flutter-3.22.0'
        
    - name: Show Flutter version
      run: flutter --version
      
    - name: Install dependencies
      run: |
        flutter pub get
        flutter pub run flutter_launcher_icons:main
        
    - name: Run tests
      run: flutter test
      
    - name: Build APK (Release)
      run: |
        flutter build apk --release --no-tree-shake-icons --target-platform android-arm,android-arm64
        
    - name: Build AppBundle (Release)
      run: |
        flutter build appbundle --release --no-tree-shake-icons
        
    - name: Show build outputs
      run: |
        echo "📦 ملفات البناء:"
        find build -name "*.apk" -o -name "*.aab" | head -10
        ls -la build/app/outputs/
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: ppfo-flutter-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
        
    - name: Upload AppBundle artifact
      uses: actions/upload-artifact@v4
      with:
        name: ppfo-app-bundle
        path: build/app/outputs/bundle/release/app-release.aab
        retention-days: 30
        
    - name: Upload Debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: ppfo-debug-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
        retention-days: 30
        
    - name: Create GitHub Release
      if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/app/outputs/flutter-apk/app-release.apk
          build/app/outputs/bundle/release/app-release.aab
        tag_name: v${{ github.event.inputs.version || github.run_number }}
        name: "PPFO Flutter v25.0 Build #${{ github.run_number }}"
        body: |
          📱 **PPFO v25.0 - تطبيق الرياضيات المتقدم (Flutter)**
          
          🔢 **نظام رياضي متكامل** تم تطويره باستخدام Flutter يحتوي على:
          - تحليل الأعداد إلى عوامل أولية
          - متسلسلات تايلور المتقدمة  
          - دالة زيتا ريـمان وأصفارها
          - دوال رياضية خاصة
          - واجهة مستخدم عربية
          
          👨‍💻 **المطور**: الدكتور سعودي محمد
          ⚡ **بُني تلقائياً بتاريخ**: ${{ github.event.head_commit.timestamp }}
          🔨 **رقم البناء**: ${{ github.run_number }}
          🛠️ **باستخدام**: Flutter 3.22.0
          
          ### 📥 التحميل:
          - `app-release.apk`: للتثبيت المباشر على الأجهزة
          - `app-release.aab`: لرفع متجر Google Play
          
          ### 🔢 الميزات الرياضية:
          ✅ تحليل الأعداد إلى عوامل أولية  
          ✅ متسلسلات تايلور المتقدمة  
          ✅ دالة زيتا ريـمان  
          ✅ دوال رياضية متخصصة  
          ✅ واجهة مستخدم عربية كاملة  
          
          ### 📄 حقوق الملكية:
          جميع الحقوق محفوظة © 2025 - الدكتور سعودي محمد
